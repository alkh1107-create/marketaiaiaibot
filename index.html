<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
               background: #111; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; width: 60%; background: #222; color: white; }
        button { padding: 12px 20px; background: #007aff; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .card { background: #222; padding: 15px; margin: 10px 0; border-radius: 12px; cursor: pointer; border: 1px solid #333; }
        #chart { width: 100%; border-radius: 12px; display: none; margin-top: 20px; }
        .loader { display: none; margin: 20px; color: #007aff; font-weight: bold; }
        .forecast-box { background: #222; padding: 15px; border-radius: 12px; margin-top: 15px; display: none; border: 1px solid #007aff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>AI Predictor 📈</h2>
        <div style="display:flex; gap:10px; justify-content:center;">
            <input type="text" id="tickerInput" placeholder="Введите RUB, BTC...">
            <button onclick="search()">Поиск</button>
        </div>

        <div id="loader" class="loader">Анализируем рынок... ⌛</div>
        <div id="results"></div>
        
        <div id="forecastBox" class="forecast-box">
            <h3 id="dirText"></h3>
            <p id="confText"></p>
        </div>
        
        <img id="chart" src="" alt="Результат">
    </div>

    <script>
        // ЗАМЕНИ НА СВОЙ АДРЕС NGROK
        const API_BASE = "https://mosaic-headache-giddily.ngrok-free.dev/search_ticker?query=RUB";

        // Общие заголовки для обхода защиты ngrok
        const headers = { "ngrok-skip-browser-warning": "true" };

        async function search() {
            const q = document.getElementById('tickerInput').value;
            const res = await fetch(`${API_BASE}/search_ticker?query=${q}`, { headers });
            const json = await res.json();
            
            let html = '';
            json.data.forEach(item => {
                html += `<div class="card" onclick="analyze('${item.symbol}')">
                            ${item.name} (${item.symbol})
                         </div>`;
            });
            document.getElementById('results').innerHTML = html;
        }

        async function analyze(symbol) {
            document.getElementById('results').innerHTML = '';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('chart').style.display = 'none';
            document.getElementById('forecastBox').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/analyze?ticker=${symbol}`, { headers });
                const data = await res.json();

                if(data.status === "success") {
                    document.getElementById('chart').src = "data:image/png;base64," + data.plot;
                    document.getElementById('chart').style.display = 'block';
                    
                    document.getElementById('dirText').innerText = "Прогноз: " + data.forecast.direction;
                    document.getElementById('confText').innerText = "Уверенность: " + data.forecast.confidence + "%";
                    document.getElementById('forecastBox').style.display = 'block';
                } else {
                    alert("Ошибка сервера: " + data.message);
                }
            } catch (e) {
                alert("Ошибка соединения. Проверьте, запущен ли ngrok.");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
