<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trader Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #222; color: #fff; }
        button { padding: 12px; background: #007aff; color: white; border: none; border-radius: 10px; font-weight: bold; }
        .card { background: #1c1c1e; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; text-align: left; }
        #chart { width: 100%; border-radius: 12px; display: none; margin-top: 15px; }
        .loader { display: none; color: #007aff; margin: 20px; }
    </style>
</head>
<body>
    <h3>AI Predictor 📈</h3>
    <div class="search-box">
        <input type="text" id="tickerInput" placeholder="Введите RUB или BTC...">
        <button onclick="search()">Найти</button>
    </div>

    <div id="loader" class="loader">Анализирую...</div>
    <div id="results"></div>
    <img id="chart">

    <script>
        // !!! ПРОВЕРЬ ЭТОТ АДРЕС ЕЩЕ РАЗ !!! 
        // Он должен быть в точности как тот, что ты открывал в браузере
        const API_BASE = "https://mosaic-headache-giddily.ngrok-free.dev/search_ticker?query=RUB";

        async function search() {
            const q = document.getElementById('tickerInput').value.trim();
            if (!q) return;

            console.log("Отправляю запрос на:", `${API_BASE}/search_ticker?query=${q}`);
            
            document.getElementById('loader').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            try {
                const res = await fetch(`${API_BASE}/search_ticker?query=${q}`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                
                if (!res.ok) throw new Error("Ошибка сети: " + res.status);
                
                const json = await res.json();
                console.log("Ответ от сервера:", json);

                if (json.data && json.data.length > 0) {
                    let html = '';
                    json.data.forEach(item => {
                        html += `<div class="card" onclick="analyze('${item.symbol}')">
                                    <b>${item.name}</b><br><small>${item.symbol}</small>
                                 </div>`;
                    });
                    document.getElementById('results').innerHTML = html;
                } else {
                    document.getElementById('results').innerHTML = "Ничего не найдено (сервер вернул пустой список)";
                }
            } catch (err) {
                console.error("Ошибка запроса:", err);
                alert("Ошибка связи с сервером. Проверьте адрес ngrok!");
                document.getElementById('results').innerHTML = "Ошибка: " + err.message;
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        async function analyze(symbol) {
            document.getElementById('results').innerHTML = '';
            document.getElementById('loader').style.display = 'block';
            
            try {
                const res = await fetch(`${API_BASE}/analyze?ticker=${symbol}`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                const data = await res.json();
                if (data.status === "success") {
                    const img = document.getElementById('chart');
                    img.src = "data:image/png;base64," + data.plot;
                    img.style.display = 'block';
                    alert("Прогноз: " + data.forecast.direction);
                }
            } catch (e) {
                alert("Ошибка при анализе");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
