<!DOCTYPE html>
<html>
<head>
    <title>ML Trading Bot</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; }
        .container { margin-top: 50px; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #00ff88; border: none; cursor: pointer; font-weight: bold; }
        #plot { margin-top: 20px; max-width: 90%; border: 2px solid #333; }
        .res { font-size: 20px; margin: 20px; color: #00ff88; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Прогноз на завтра</h1>
        <input type="text" id="ticker" value="RUB=X">
        <button onclick="run()">Анализ</button>
        <div id="loading" style="display:none;">Считаю нейронками...</div>
        <div id="result" class="res"></div>
        <img id="plot">
    </div>

    <script>
        async function run() {
            const ticker = document.getElementById('ticker').value;
            // ЗАМЕНИ ЭТУ ССЫЛКУ НА ТУ, ЧТО ВЫДАЛ COLAB
            const url = "https://mosaic-headache-giddily.ngrok-free.dev"; 
            
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch(`${url}/analyze?ticker=${ticker}`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                const data = await response.json();
                
                document.getElementById('result').innerHTML = `
                    Дата: ${data.forecast.date} <br>
                    Направление: ${data.forecast.direction} <br>
                    Уверенность: ${data.forecast.confidence}
                `;
                document.getElementById('plot').src = "data:image/png;base64," + data.plot;
            } catch (e) {
                alert("Ошибка! Проверь, запущен ли Colab и верна ли ссылка.");
            }
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
