<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c1c1c; color: white; text-align: center; padding: 20px; }
        input { padding: 10px; border-radius: 5px; border: none; width: 70%; }
        button { padding: 10px; background: #2481cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .ticker-card { background: #2c2c2c; margin: 10px; padding: 10px; border-radius: 8px; cursor: pointer; }
        #chart { width: 100%; margin-top: 20px; display: none; border-radius: 10px; }
        .loader { display: none; color: #aaa; margin: 20px; }
    </style>
</head>
<body>
    <h2>AI Market Predictor</h2>
    
    <input type="text" id="searchInp" placeholder="Напр: RUB, BTC, Apple...">
    <button onclick="search()">Поиск</button>

    <div id="results"></div>
    <div class="loader" id="loader">Нейросеть думает... 🧠</div>
    <img id="chart" src="" alt="График анализа">

    <script>
        const API_BASE = "https://mosaic-headache-giddily.ngrok-free.dev";

        async function search() {
            const query = document.getElementById('searchInp').value;
            const res = await fetch(`${API_BASE}/search_ticker?query=${query}`);
            const json = await res.json();
            
            let html = '';
            json.data.forEach(item => {
                html += `<div class="ticker-card" onclick="analyze('${item.symbol}')">
                            ${item.name} (${item.symbol})
                         </div>`;
            });
            document.getElementById('results').innerHTML = html;
        }

        async function analyze(symbol) {
            document.getElementById('results').innerHTML = '';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('chart').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/analyze?ticker=${symbol}`);
                const data = await res.json();

                if(data.status === "success") {
                    const chartImg = document.getElementById('chart');
                    chartImg.src = "data:image/png;base64," + data.plot;
                    chartImg.style.display = 'block';
                    alert(`Прогноз: ${data.forecast.direction}\nУверенность: ${data.forecast.confidence}`);
                }
            } catch (e) {
                alert("Ошибка анализа");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
