<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Predictor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
        .search-area { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #333; background: #1c1c1e; color: #fff; font-size: 16px; }
        button { padding: 12px 18px; border-radius: 12px; border: none; background: #007aff; color: #fff; font-weight: 700; cursor: pointer; }
        .card { background: #1c1c1e; padding: 16px; margin-bottom: 12px; border-radius: 14px; border: 1px solid #2c2c2e; animation: fadeIn 0.3s; }
        .card:active { background: #2c2c2e; }
        #chart { width: 100%; border-radius: 16px; display: none; margin-top: 15px; border: 1px solid #333; }
        .loader { display: none; color: #007aff; text-align: center; margin: 20px; font-weight: bold; }
        .result-box { background: #1c1c1e; padding: 20px; border-radius: 16px; border: 1px solid #007aff; display: none; margin-top: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <h2 style="text-align:center;">AI Market Intelligence 🤖</h2>
    
    <div class="search-area">
        <input type="text" id="tickerInput" placeholder="Поиск (RUB, BTC...)" onkeypress="if(event.key==='Enter') search()">
        <button onclick="search()">Найти</button>
    </div>

    <div id="loader" class="loader">🧠 Нейросеть анализирует графики...</div>
    <div id="results"></div>

    <div id="resultBox" class="result-box">
        <div id="dirText" style="font-size: 20px; font-weight: 800; color: #34c759;"></div>
        <div id="confText" style="color: #8e8e93; margin: 8px 0;"></div>
        <img id="chart">
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // !!! ЗАМЕНИ ЭТОТ URL НА СВОЙ !!!
        const API_BASE = "https://mosaic-headache-giddily.ngrok-free.dev/search_ticker?query=RUB";
        const headers = { "ngrok-skip-browser-warning": "true" };

        async function search() {
            const q = document.getElementById('tickerInput').value.trim();
            const resDiv = document.getElementById('results');
            const loader = document.getElementById('loader');

            resDiv.innerHTML = '';
            document.getElementById('resultBox').style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/search_ticker?query=${encodeURIComponent(q)}`, { headers });
                const json = await response.json();

                if (json.data && json.data.length > 0) {
                    json.data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `<strong>${item.name}</strong><br><small style="color:#8e8e93">${item.symbol}</small>`;
                        div.onclick = () => analyze(item.symbol);
                        resDiv.appendChild(div);
                    });
                } else {
                    resDiv.innerHTML = "<p style='text-align:center; color:#8e8e93;'>Ничего не нашли. Попробуйте 'RUB'</p>";
                }
            } catch (e) {
                alert("Ошибка связи с сервером. Проверьте ngrok!");
            } finally {
                loader.style.display = 'none';
            }
        }

        async function analyze(symbol) {
            document.getElementById('results').innerHTML = '';
            document.getElementById('loader').style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/analyze?ticker=${symbol}`, { headers });
                const data = await response.json();

                if (data.status === "success") {
                    document.getElementById('dirText').innerText = data.forecast.direction;
                    document.getElementById('dirText').style.color = data.forecast.direction.includes("ВВЕРХ") ? "#34c759" : "#ff3b30";
                    document.getElementById('confText').innerText = "Уверенность моделей: " + data.forecast.confidence + "%";
                    
                    const img = document.getElementById('chart');
                    img.src = "data:image/png;base64," + data.plot;
                    img.style.display = 'block';
                    
                    document.getElementById('resultBox').style.display = 'block';
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                }
            } catch (e) {
                alert("Ошибка анализа");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
